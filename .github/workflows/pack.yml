name: Pack and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Pack the plans (as a release would)
        run: python3 tools/pack.py
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Pack the release
        run: python3 tools/pack.py --version "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="workouts-$GITHUB_REF_NAME.tar.gz"
          sha=$(cut -d' ' -f1 "dist/$name.sha256")
          gh release create "$GITHUB_REF_NAME" "dist/$name" "dist/$name.sha256" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Workout plans for bensonlabs.org/projects/workouts/. sha256 of $name: $sha. To publish it, run python3 .github/scripts/components.py bump workouts $GITHUB_REF_NAME in the blog."
